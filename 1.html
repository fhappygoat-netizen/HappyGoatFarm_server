<!doctype html><html lang=ar dir=rtl><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>اللوحة الخشبية الريفية مع الماعز</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;overflow:hidden;height:800px}.main-container{display:flex;align-items:center;justify-content:center;gap:40px;position:relative;width:100%;height:100%;max-width:800px;padding:20px;box-sizing:border-box}.goat-container{position:absolute;z-index:10;left:20px;transform:rotate(-8deg);animation:float 3s ease-in-out infinite;max-width:250px;position:relative;top:10px;opacity:0;animation:float 3s ease-in-out infinite,fadeInLeft 1s ease-out forwards;animation-delay:.5s}.goat-container img{width:120%;height:100%;object-fit:contain;filter:drop-shadow(5px 5px 10px rgba(0,0,0,.3))}.wooden-sign{position:relative;width:800px;height:600px;padding:30px 0;max-width:100%;margin:0 auto;opacity:0;animation:fadeIn 1s ease-out forwards;animation-delay:.2s}.board{position:absolute;width:100%;height:130px;background:linear-gradient(90deg,#4a3c28,#5d4e37,#4a3c28,#3e3223,#5d4e37);background-size:200% 100%;border-radius:8px;box-shadow:inset 0 2px 5px rgba(0,0,0,.4),0 5px 15px rgba(0,0,0,.3);transition:transform .3s ease;display:flex;align-items:center;justify-content:center;color:wheat;font-size:24px;font-weight:700;text-shadow:2px 2px 4px rgba(0,0,0,.5);padding:0 40px;box-sizing:border-box;text-align:center;opacity:0;transform:translateY(30px)}.board-1{top:0;transform:rotate(-.3deg) translateY(30px);animation:slideInUp .8s ease-out forwards;animation-delay:.8s}.board-2{top:145px;transform:rotate(.4deg) translateY(30px);animation:slideInUp .8s ease-out forwards;animation-delay:1s}.board-3{top:290px;transform:rotate(-.2deg) translateY(30px);animation:slideInUp .8s ease-out forwards;animation-delay:1.2s}.board-4{top:435px;transform:rotate(.5deg) translateY(30px);animation:slideInUp .8s ease-out forwards;animation-delay:1.4s}.board:hover{transform:scale(1.01) rotate(0)}.post{position:absolute;width:50px;height:620px;background:linear-gradient(180deg,#2c2416,#3e3223,#2c2416);border-radius:5px;box-shadow:0 0 10px rgba(0,0,0,.5);z-index:-1;opacity:0}.post-left{left:-25px;top:-27px;animation:fadeIn 1s ease-out forwards;animation-delay:.4s}.post-right{right:-25px;top:-27px;animation:fadeIn 1s ease-out forwards;animation-delay:.6s}.screw{position:absolute;width:8px;height:8px;background:radial-gradient(circle,silver,grey);border-radius:50%;box-shadow:inset 0 0 2px rgba(0,0,0,.7),0 1px 1px rgba(255,255,255,.5);opacity:0;animation:fadeIn .5s ease-out forwards}@keyframes float{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-15px) rotate(-8deg)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes fadeInLeft{from{opacity:0;transform:translateX(-50px) rotate(-8deg)}to{opacity:1;transform:translateX(0) rotate(-8deg)}}@keyframes slideInUp{from{opacity:0;transform:translateY(30px) rotate(var(--rotation,0deg))}to{opacity:1;transform:translateY(0) rotate(var(--rotation,0deg))}}.task-list{list-style-type:none;padding:0;margin:0;width:100%}.task-item{margin-bottom:8px;display:flex;align-items:center;justify-content:flex-start;width:100%;opacity:0;animation:fadeIn .5s ease-out forwards}.board-1 .task-item:first-child{animation-delay:1.6s}.board-1 .task-item:nth-child(2){animation-delay:1.7s}.board-2 .task-item:first-child{animation-delay:1.8s}.board-2 .task-item:nth-child(2){animation-delay:1.9s}.board-3 .task-item:first-child{animation-delay:2s}.board-3 .task-item:nth-child(2){animation-delay:2.1s}.board-4 .task-item:first-child{animation-delay:2.2s}.board-4 .task-item:nth-child(2){animation-delay:2.3s}.task-checkbox{width:18px;height:18px;margin-left:15px;border:2px solid wheat;border-radius:3px;background-color:transparent;cursor:pointer}@media (max-width:1200px){.wooden-sign{width:70vw;height:500px}.board{height:110px;font-size:20px}.board-1{top:0}.board-2{top:120px}.board-3{top:240px}.board-4{top:360px}.post{height:520px}.goat-container{height:500px;top:80px}}@media (max-width:768px){.main-container{flex-direction:column;gap:20px}.goat-container{position:relative;right:auto;top:auto;width:100%;left:80px;top:50px;margin-bottom:20px;transform:rotate(-10deg)!important;height:300px}.wooden-sign{width:90vw;height:400px}.board{height:90px;font-size:18px;padding:0 20px}.board-1{top:0}.board-2{top:100px}.board-3{top:200px}.board-4{top:300px}.post{height:420px}}@media (max-width:480px){.board{font-size:16px;height:80px}.board-1{top:0}.board-2{top:85px}.board-3{top:170px}.board-4{top:255px}.task-item{font-size:14px}.task-checkbox{width:15px;height:15px}.wooden-sign{height:350px}.post{height:370px}}</style></head><body><div class=main-container><div class=goat-container><img id=goat-image src=2.png alt="ماعز كرتوني بحجم كبير"></div><div class=wooden-sign><div class="post post-left"></div><div class="post post-right"></div><div class="board board-1"><ul class=task-list><li class=task-item><input type=checkbox class=task-checkbox> <span>🌾 طعام الصباح</span></li><li class=task-item><input type=checkbox class=task-checkbox> <span>💧 شرب الماء</span></li></ul></div><div class="board board-2"><ul class=task-list><li class=task-item><input type=checkbox class=task-checkbox> <span>🚶‍♂️ نزهة في المرج</span></li><li class=task-item><input type=checkbox class=task-checkbox> <span>🏃‍♂️ القفز على الصخور</span></li></ul></div><div class="board board-3"><ul class=task-list><li class=task-item><input type=checkbox class=task-checkbox> <span>😴 قيلولة بعد الظهر</span></li><li class=task-item><input type=checkbox class=task-checkbox> <span>🎾 لعب مع الأصدقاء</span></li></ul></div><div class="board board-4"><ul class=task-list><li class=task-item><input type=checkbox class=task-checkbox> <span>🌙 طعام المساء</span></li><li class=task-item><input type=checkbox class=task-checkbox> <span>🛌 النوم المبكر</span></li></ul></div></div></div><script>document.addEventListener("DOMContentLoaded",()=>{function e(e,t,n,c){const o=document.createElement("div");o.className="screw";const a="left"===t?"20px":"calc(100% - 28px)";o.style[t]=a;const d=15+70*Math.random();o.style.top=`${d}%`;const l=.8+.2*n+.1*c;o.style.animationDelay=`${l}s`,e.appendChild(o)}document.querySelectorAll(".board").forEach((t,n)=>{for(let c=0;c<2;c++)e(t,"left",n,c),e(t,"right",n,c)});function t(){const e=document.getElementById("goat-image"),t=window.innerWidth;e.src=t<=768?"black-goat-cartoon-character_1308-109008.png":"2.png"}document.querySelectorAll(".task-checkbox").forEach(e=>{"checked"===localStorage.getItem(e.nextElementSibling.textContent)&&(e.checked=!0),e.addEventListener("change",function(){localStorage.setItem(this.nextElementSibling.textContent,this.checked?"checked":"unchecked")})}),t(),window.addEventListener("resize",t)})</script></body></html>
