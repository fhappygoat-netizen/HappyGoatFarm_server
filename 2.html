<!doctype html><html lang=ar dir=rtl><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>اللوحة الخشبية الريفية</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background-color:#111827;font-family:Pacifico,cursive,sans-serif;overflow-x:hidden;height:100vh;display:flex;align-items:center;justify-content:center}.main-container{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;width:100%;max-width:600px;padding:20px 10px;margin:0 auto;height:100%}.central-post{position:absolute;left:50%;transform:translateX(-50%);width:30px;height:90%;background:linear-gradient(180deg,#2c2416,#3e3223,#2c2416,#3e3223,#2c2416);background-size:100% 200%;border-radius:6px;box-shadow:inset 0 0 10px rgba(0,0,0,.4),0 0 15px rgba(0,0,0,.3);z-index:-1;opacity:0;animation:growDown 1s ease-out forwards}.wooden-board{position:relative;width:240px;height:90px;margin:10px 0;background:linear-gradient(90deg,#4a3c28,#5d4e37,#4a3c28,#3e3223,#5d4e37);background-size:200% 100%;border-radius:6px;box-shadow:inset 0 2px 5px rgba(0,0,0,.4),0 5px 15px rgba(0,0,0,.3);transition:transform .3s ease;display:flex;align-items:center;justify-content:center;color:wheat;font-size:18px;font-weight:700;text-shadow:2px 2px 4px rgba(0,0,0,.5);padding:0 30px;box-sizing:border-box;text-align:center;opacity:0}.board-right{transform:translateX(45px) rotate(1deg);animation:slideInRight .8s ease-out forwards}.board-left{transform:translateX(-45px) rotate(-1deg);animation:slideInLeft .8s ease-out forwards}.wooden-board:hover{transform:translateX(0) rotate(0) scale(1.02)}.screw{position:absolute;width:6px;height:6px;background:radial-gradient(circle,silver,grey);border-radius:50%;box-shadow:inset 0 0 2px rgba(0,0,0,.7),0 1px 1px rgba(255,255,255,.5);opacity:0;animation:fadeIn .5s ease-out forwards}.task-list{list-style-type:none;padding:0;margin:0;width:100%}.task-item{margin-bottom:6px;display:flex;align-items:center;justify-content:flex-start;width:100%;opacity:0;animation:fadeIn .5s ease-out forwards}.task-checkbox{width:14px;height:14px;margin-left:10px;border:2px solid wheat;border-radius:3px;background-color:transparent;cursor:pointer}.board-right:nth-child(2){animation-delay:.5s}.board-left:nth-child(3){animation-delay:.8s}.board-right:nth-child(4){animation-delay:1.1s}.board-left:nth-child(5){animation-delay:1.4s}.board-right:nth-child(2) .task-item:first-child{animation-delay:.7s}.board-right:nth-child(2) .task-item:nth-child(2){animation-delay:.8s}.board-left:nth-child(3) .task-item:first-child{animation-delay:1s}.board-left:nth-child(3) .task-item:nth-child(2){animation-delay:1.1s}.board-right:nth-child(4) .task-item:first-child{animation-delay:1.3s}.board-right:nth-child(4) .task-item:nth-child(2){animation-delay:1.4s}.board-left:nth-child(5) .task-item:first-child{animation-delay:1.6s}.board-left:nth-child(5) .task-item:nth-child(2){animation-delay:1.7s}@keyframes growDown{from{opacity:0;transform:translateX(-50%) scaleY(0);transform-origin:top center}to{opacity:1;transform:translateX(-50%) scaleY(1);transform-origin:top center}}@keyframes slideInRight{from{opacity:0;transform:translateX(100px) rotate(1deg)}to{opacity:1;transform:translateX(45px) rotate(1deg)}}@keyframes slideInLeft{from{opacity:0;transform:translateX(-100px) rotate(-1deg)}to{opacity:1;transform:translateX(-45px) rotate(-1deg)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@media (max-width:768px){.main-container{padding:15px 8px}.central-post{width:25px}.wooden-board{width:200px;height:75px;font-size:16px}.board-right{transform:translateX(35px) rotate(1deg)}.board-left{transform:translateX(-35px) rotate(-1deg)}.task-item{font-size:14px}.task-checkbox{width:12px;height:12px}}@media (max-width:480px){.wooden-board{width:180px;height:65px;font-size:14px;padding:0 15px}.board-right{transform:translateX(30px) rotate(1deg)}.board-left{transform:translateX(-30px) rotate(-1deg)}.task-item{font-size:12px}.task-checkbox{width:10px;height:10px}}</style></head><body><div class=main-container><div class=central-post></div><div class="wooden-board board-right"><ul class=task-list><li class=task-item><input type=checkbox class=task-checkbox> <span>🌾 طعام الصباح</span></li><li class=task-item><input type=checkbox class=task-checkbox> <span>💧 شرب الماء</span></li></ul></div><div class="wooden-board board-left"><ul class=task-list><li class=task-item><input type=checkbox class=task-checkbox> <span>🚶‍♂️ نزهة في المرج</span></li><li class=task-item><input type=checkbox class=task-checkbox> <span>🏃‍♂️ القفز على الصخور</span></li></ul></div><div class="wooden-board board-right"><ul class=task-list><li class=task-item><input type=checkbox class=task-checkbox> <span>😴 قيلولة بعد الظهر</span></li><li class=task-item><input type=checkbox class=task-checkbox> <span>🎾 لعب مع الأصدقاء</span></li></ul></div><div class="wooden-board board-left"><ul class=task-list><li class=task-item><input type=checkbox class=task-checkbox> <span>🌙 طعام المساء</span></li><li class=task-item><input type=checkbox class=task-checkbox> <span>🛌 النوم المبكر</span></li></ul></div></div><script>document.addEventListener("DOMContentLoaded",()=>{function e(e,t,n){const c=document.createElement("div");c.className="screw";const o=e.offsetWidth/2;c.style.left="center-left"===t?o-12+"px":`${o+6}px`;const l=20+60*Math.random();c.style.top=`${l}%`;const d=.7+.3*n;c.style.animationDelay=`${d}s`,e.appendChild(c)}document.querySelectorAll(".wooden-board").forEach((t,n)=>{e(t,"center-left",n),e(t,"center-right",n)});document.querySelectorAll(".task-checkbox").forEach(e=>{"checked"===localStorage.getItem(e.nextElementSibling.textContent)&&(e.checked=!0),e.addEventListener("change",function(){localStorage.setItem(this.nextElementSibling.textContent,this.checked?"checked":"unchecked")})})})</script></body></html>
